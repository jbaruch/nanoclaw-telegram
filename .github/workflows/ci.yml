name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # No scanner tracks .nvmrc: renew monthly within Node 24 LTS,
          # and move to the next supported LTS before Node 24 reaches EOL.
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Bootstrap lint
        run: |
          npx prettier --check setup/bootstrap.test.ts
          npx eslint setup/bootstrap.test.ts

      - name: Bootstrap test typecheck
        run: npx tsc --noEmit -p tsconfig.setup.json

      - name: Tests
        run: npx vitest run
