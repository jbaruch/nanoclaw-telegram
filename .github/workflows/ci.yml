name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          # Key the npm cache on both lockfiles — the job runs a second
          # `npm ci` in container/agent-runner (its own package), which the
          # default root-only key would leave uncached.
          cache-dependency-path: |
            package-lock.json
            container/agent-runner/package-lock.json
      - run: npm ci

      # The root format:check glob now also covers container/agent-runner/src
      # (#701) — the agent-runner is its own npm package, so it had been
      # outside the gate and half its files had drifted from root prettier.
      # Folding the glob into the root script keeps a single format gate that
      # resolves the repo's one pinned prettier, before the slower
      # typecheck/tests (`coding-policy: code-formatting`).
      - name: Format check
        run: npm run format:check

      # Lint gate (before the slower typecheck/tests, per
      # `coding-policy: code-formatting`). Covers src/, scripts/, setup/, and
      # container/agent-runner/src (the `lint` script's scope). The parser is
      # not type-aware (`tseslint.configs.recommended`), so this needs only the
      # root `npm ci` above — no agent-runner deps. `no-catch-all/no-catch-all`
      # is error-level (#735); `@typescript-eslint/no-explicit-any` stays a
      # non-failing warning until its own burn-down lands.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # The agent-runner has its own tsconfig and deps (claude-agent-sdk et
      # al. resolve only from its own node_modules), so root tsc never
      # typechecked it. Its *tests* already run via the root vitest config;
      # this adds the missing typecheck. Install its deps, then run its tsc.
      - name: Install agent-runner deps
        working-directory: container/agent-runner
        run: npm ci

      # Two configs, deliberately:
      #   tsconfig.json      — the package's build (emits to dist/), so it
      #                        excludes `src/**/*.test.ts`; compiling tests
      #                        would ship them in the image.
      #   tsconfig.test.json — noEmit, includes the tests.
      # A bare `tsc --noEmit` here silently reads the FIRST one, which is how
      # test files went untypechecked while a step named "Typecheck
      # (agent-runner)" passed (#795).
      #
      # Run from the repo root, not this package: the root vitest config owns
      # these test files and the root manifest declares `vitest`, so the root
      # owns their typecheck. Needs both installs — the root's (step above)
      # and the agent-runner's (step directly above this one).
      - name: Typecheck (agent-runner, incl. tests)
        run: npm run typecheck:agent-runner

      # Python tests live alongside scripts that need them. Stdlib
      # unittest only — no pytest dependency to install. Wired here
      # so new coverage is exercised by the PR gate per
      # `coding-policy: ci-safety` ("Never Skip Tests") and
      # `coding-policy: testing-standards` ("Every module gets tests").
      - name: Python tests (deploy agent-grep predicate)
        run: python3 -m unittest scripts.test_deploy_agent_grep

      # audible-backup sidecar lives under a hyphenated directory, so
      # we invoke unittest from inside it rather than via dotted
      # module path (Python's import system rejects `-` in package
      # names).
      - name: Python tests (audible-backup sidecar)
        working-directory: container/audible-backup
        run: python3 -m unittest test_backup test_enrich

      # Build the sidecar image so a broken RECIPE fails at PR time (#895).
      #
      # The unit tests above import backup.py directly; they never exercise
      # the Dockerfile, so nothing noticed when Dependabot #738 moved the
      # base image to python:3.14-slim while `audible-cli==0.3.3` declared
      # `requires-python <3.14`. That PR merged green, the image became
      # unbuildable, and the break only surfaced 13 days later when a host
      # prune removed the last image built under 3.13.
      #
      # This is a build only — nothing is pushed, and no Audible
      # credentials are involved. It costs ~1 min and turns the next
      # base-image bump that breaks the pin into a red check on the bump's
      # own PR. `audible-cli==0.4.0` declares `<3.15`, so python:3.15-slim
      # is the next one this will catch.
      - name: Build audible-backup sidecar image
        run: ./container/audible-backup/build.sh
