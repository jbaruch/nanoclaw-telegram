name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # Python tests live alongside the only Python script in the
      # repo (`scripts/trakt-auth.py`). Stdlib unittest only — no
      # pytest dependency to install. Wired here so the new coverage
      # is exercised by the PR gate per `coding-policy: ci-safety`
      # ("Never Skip Tests") and `coding-policy: testing-standards`
      # ("Every module gets tests").
      - name: Python tests (trakt-auth)
        run: python3 -m unittest scripts.test_trakt_auth
