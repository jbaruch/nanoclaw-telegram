name: CI

on:
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Format check
        run: npm run format:check

      # The agent-runner is its own npm package (own tsconfig, own deps),
      # so the root format:check glob (src/**) and root tsc never covered
      # it (#701). Its *tests* are picked up by the root vitest config, but
      # format and typecheck were unenforced — half the package's files had
      # drifted from root prettier. Prettier is the repo's single canonical
      # formatter (declared at root); invoke it inline against the
      # agent-runner tree — no second prettier to declare/version in the
      # subpackage. `working-directory` makes prettier read the subpackage's
      # .prettierignore (the macOS AppleDouble exclude). Runs alongside the
      # root format gate, before the slower typecheck/tests, to fail fast on
      # cheap style issues (`coding-policy: code-formatting`).
      - name: Format check (agent-runner)
        working-directory: container/agent-runner
        run: npx prettier --check "src/**/*.ts"

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Tests
        run: npx vitest run

      # The agent-runner typecheck needs its own deps (claude-agent-sdk et
      # al. resolve only from its own node_modules) and its own tsc, so it
      # installs and runs after the root suite rather than gating fail-fast.
      - name: Install agent-runner deps
        working-directory: container/agent-runner
        run: npm ci

      - name: Typecheck (agent-runner)
        working-directory: container/agent-runner
        run: npx tsc --noEmit

      # Python tests live alongside scripts that need them. Stdlib
      # unittest only — no pytest dependency to install. Wired here
      # so new coverage is exercised by the PR gate per
      # `coding-policy: ci-safety` ("Never Skip Tests") and
      # `coding-policy: testing-standards` ("Every module gets tests").
      - name: Python tests (trakt-auth)
        run: python3 -m unittest scripts.test_trakt_auth

      - name: Python tests (deploy agent-grep predicate)
        run: python3 -m unittest scripts.test_deploy_agent_grep

      - name: Python tests (deploy gateway verify-and-re-up)
        run: python3 -m unittest scripts.test_ensure_gateway_up

      # audible-backup sidecar lives under a hyphenated directory, so
      # we invoke unittest from inside it rather than via dotted
      # module path (Python's import system rejects `-` in package
      # names).
      - name: Python tests (audible-backup sidecar)
        working-directory: container/audible-backup
        run: python3 -m unittest test_backup test_enrich
