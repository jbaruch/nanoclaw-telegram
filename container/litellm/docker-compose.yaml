# nanoclaw-litellm — the LiteLLM router's compose file. Lives in the
# repo so `deploy.sh`-adjacent edits (config bumps, image-tag
# bumps, CHANGELOG-coordinated changes) flow through normal PR
# review. UGOS Pro discovers it via a symlink at
# `/volume1/docker/nanoclaw-litellm` → `container/litellm/`.
#
# Setup (one-time, on the NAS) — PROVEN model verified 2026-05-23.
# Source-of-truth: this repo. UGOS Pro UI: visibility surface +
# Start/Stop button only. Secrets: in `~/nanoclaw/.env`, reached via
# a symlinked `.env` in this directory. NEVER paste literal env
# values into UGOS Pro's project env UI — those get written into
# the compose file's `environment:` block and (because the project
# dir is a symlink to this repo dir) leak into the tracked source
# tree.
#
# 1. FIRST clear out the pre-removal `nanoclaw-litellm` container if
#    one is still alive — it publishes the same host port 4000 and
#    would block the new project from starting:
#      cd ~/nanoclaw && docker compose stop nanoclaw-litellm \
#        && docker compose rm -f nanoclaw-litellm
#    (`./scripts/deploy.sh` also handles this via `--remove-orphans`
#    on its `docker compose up -d --build` line.)
#
# 2. Create the directory symlink so UGOS Pro discovers the compose
#    file under the conventional path:
#      ln -s /home/jbaruch/nanoclaw/container/litellm \
#            /volume1/docker/nanoclaw-litellm
#
# 3. Create the `.env` symlink inside this directory so docker
#    compose interpolates `${VAR}` placeholders from `~/nanoclaw/.env`
#    at spawn time. The `.env` file IS gitignored at the repo root,
#    so a symlink at this path is safe. Required vars on the host
#    side: `LITELLM_MASTER_KEY`, `ANTHROPIC_API_KEY`,
#    `LITELLM_GATEWAY_API_KEY` (optional — leave unset until
#    minted; LiteLLM will route via the Anthropic-direct fallback
#    rows in `litellm.config.yaml`):
#      ln -s ../../.env /home/jbaruch/nanoclaw/container/litellm/.env
#    Linux resolves the relative target against the symlink's own
#    parent dir, so the chain
#      /volume1/docker/nanoclaw-litellm/.env
#        → ~/nanoclaw/container/litellm/.env
#        → ~/nanoclaw/.env
#    resolves correctly at docker compose read time.
#
# 4. Insert the UGOS Pro DB row so the project appears in the
#    Projects UI. UGOS renders the UI from
#    `/volume1/@appstore/com.ugreen.docker/db/docker_info_log.db`
#    (table `compose`), and the row's `path` column tells UGOS which
#    compose file to operate against — point it at the symlinked
#    path so UI Start/Stop drives the in-repo compose. Requires
#    sudo because the DB is `root:root 644`. Example one-shot:
#      ssh -t nas 'sudo python3 -c "
#      import sqlite3
#      content = open(\"/home/jbaruch/nanoclaw/container/litellm/docker-compose.yaml\").read()
#      conn = sqlite3.connect(\"/volume1/@appstore/com.ugreen.docker/db/docker_info_log.db\")
#      conn.execute(\"INSERT INTO compose (created_at, updated_at, name, state, path, content, app_id, container_num) VALUES (datetime(\\\"now\\\"), datetime(\\\"now\\\"), \\\"nanoclaw-litellm\\\", 1, \\\"/volume1/docker/nanoclaw-litellm/docker-compose.yaml\\\", ?, \\\"\\\", 0)\", (content,))
#      conn.commit()
#      "'
#
# 5. Open UGOS Pro → Projects. The `nanoclaw-litellm` project
#    appears. Click Start (NOT "Edit" — leave env, leave compose
#    untouched in the UI; the env values flow from the symlinked
#    `.env`). Container comes up healthy on port 4000.
#
# Orchestrator cutover (when ready): set in `~/nanoclaw/.env` on the
# NAS:
#      ANTHROPIC_BASE_URL=http://192.168.10.32:4000
# (Cross-project Docker DNS doesn't resolve `nanoclaw-litellm` from
# the orchestrator's project network — reach it via the NAS LAN IP
# on the published port instead.) Then `./scripts/deploy.sh` once.
#
# Why this lives in a separate project (and not the main
# `docker-compose.yml`): see the deletion notice in the orchestrator
# service block of `/docker-compose.yml` in the repo and the
# corresponding `[Unreleased]` entry in `CHANGELOG.md`.
#
# `container_name` is intentionally omitted — Docker assigns
# `nanoclaw-litellm-nanoclaw-litellm-1` (project name + service +
# index) by default. A fixed `container_name: nanoclaw-litellm` would
# collide globally on the Docker host if a stale container from the
# pre-removal main compose still exists during cutover/rollback, and
# the orchestrator no longer reaches the router by container name
# (it uses the NAS LAN IP via `ANTHROPIC_BASE_URL`), so the
# attribution gain doesn't justify the collision risk.

services:
  nanoclaw-litellm:
    image: ghcr.io/berriai/litellm:v1.85.1
    restart: always
    command:
      - "--config"
      - "/etc/litellm/litellm.config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "1"
    volumes:
      - ./litellm.config.yaml:/etc/litellm/litellm.config.yaml:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_GATEWAY_API_KEY=${LITELLM_GATEWAY_API_KEY}
      - TZ=America/Chicago
    ports:
      - "4000:4000"
    healthcheck:
      # Use python3 because the LiteLLM upstream image ships neither
      # wget nor curl. Catches `(urllib.error.URLError, TimeoutError)`
      # per `coding-policy: error-handling` — URLError covers
      # connection refused / DNS / TLS / HTTPError on non-2xx;
      # TimeoutError is the Python 3.10+ alias for socket.timeout.
      # Anything else propagates so the operator sees the real
      # problem rather than a probe falsely reporting `unhealthy`.
      test:
        - "CMD"
        - "python3"
        - "-c"
        - |
          import urllib.request, urllib.error, sys
          try:
              urllib.request.urlopen('http://localhost:4000/health/liveliness', timeout=4).close()
              sys.exit(0)
          except (urllib.error.URLError, TimeoutError):
              print('unhealthy')
              sys.exit(1)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
