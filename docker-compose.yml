services:
  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: nanoclaw
    restart: always
    volumes:
      # Docker socket for spawning sibling agent containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data directories
      - ./store:/app/store
      - ./data:/app/data
      - ./groups:/app/groups
      - ./logs:/app/logs
      # Credentials (mounted, never baked into image). RW so the
      # trakt autorefresh path (`src/ipc.ts` fetch_trakt_history →
      # admin-tile watch-history script) can write rotated OAuth
      # tokens back to .env on a successful refresh-grant. Without
      # RW the persist step throws OSError 30 (Read-only file
      # system); the in-flight request still succeeds via the
      # in-memory bearer but the next IPC call burns another
      # refresh-grant against a now-rotated refresh token, which
      # eventually breaks.
      - ./.env:/app/.env
      # Shared trusted directory (mounted into trusted + main agent containers)
      - ./trusted:/app/trusted
      # NanoClaw config (mount allowlist, sender allowlist)
      - ${HOME}/.config/nanoclaw:/root/.config/nanoclaw:ro
      # Tessl: credentials + persistent workspace for registry installs
      - ${HOME}/.tessl:/root/.tessl
      - ./tessl-workspace:/app/tessl-workspace
    environment:
      # Docker-out-of-Docker: mount paths must reference the HOST filesystem
      - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-.}
      # Host user UID/GID for agent container --user flag
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Credential proxy binds to all interfaces so agent containers can reach it
      - CREDENTIAL_PROXY_HOST=0.0.0.0
      - TZ=America/Chicago
      - NODE_ENV=production
      # Standard log level. For deep Telegram-path diagnostics (per-call
      # grammy transformer from #87, process-wide HTTP tap from #89, the
      # `[send]`/`[ipc]` tracing from #82), set LOG_LEVEL=debug in .env
      # or the environment for the deploy run — the instrumentation is
      # still in place, just gated off at info.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Agent-image override (#69 review): src/config.ts reads
      # process.env.CONTAINER_IMAGE to decide which image to spawn
      # agent containers from; scripts/deploy.sh reads the same env
      # var to decide which image to rebuild locally. Both must come
      # from the SAME source or the script's "we rebuild what the
      # orchestrator spawns" promise breaks. Pass through here so an
      # operator who exports CONTAINER_IMAGE in their shell (or sets
      # it in `.env`, which Compose reads directly without needing a
      # shell-export) gets a consistent override across the script and
      # the orchestrator. scripts/deploy.sh has matching .env-parsing
      # logic (data-only, no source) so both reach the same value.
      - CONTAINER_IMAGE=${CONTAINER_IMAGE:-nanoclaw-agent:latest}
    ports:
      # Credential proxy — agent containers reach it via host.docker.internal:3001
      - "3001:3001"

  # LiteLLM router (#610) — sits between the credential-proxy and the
  # litellm.ai cloud gateway. The orchestrator's credential-proxy
  # forwards SDK calls here via `ANTHROPIC_BASE_URL=http://nanoclaw-litellm:4000`
  # (set in ~/nanoclaw/.env on the NAS). Stage 0 carries Anthropic-shape
  # passthrough with router-level fallback to api.anthropic.com; #613
  # populates per-workload model_list aliases.
  #
  # When this container is unreachable, the credential-proxy's
  # orchestrator-side bypass falls direct to api.anthropic.com — see
  # src/credential-proxy.ts. Router-level fallback (above) covers
  # litellm.ai gateway outages; orchestrator-side bypass covers
  # nanoclaw-litellm itself being down.
  nanoclaw-litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nanoclaw-litellm
    restart: always
    command:
      - "--config"
      - "/etc/litellm/litellm.config.yaml"
      - "--port"
      - "4000"
      - "--num_workers"
      - "1"
    volumes:
      - ./container/litellm/litellm.config.yaml:/etc/litellm/litellm.config.yaml:ro
    environment:
      # Inbound master_key — the orchestrator's credential-proxy sends
      # `x-api-key: $ANTHROPIC_API_KEY` on outbound requests, so we
      # set the LiteLLM master_key value to ANTHROPIC_API_KEY too;
      # the existing auth header passes through unchanged. The two
      # outbound keys (gateway + Anthropic-direct) come from .env
      # via env_file below.
      - LITELLM_MASTER_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_GATEWAY_API_KEY=${LITELLM_GATEWAY_API_KEY}
      - TZ=America/Chicago
    env_file:
      - .env
    ports:
      # Internal — exposed on the host so an operator can hit the
      # /health endpoint from the NAS shell during rollout debugging.
      # The orchestrator reaches it by service-name on the default
      # compose network (nanoclaw-litellm:4000); the published port
      # is for ops, not for the orchestrator.
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:4000/health/liveliness"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
