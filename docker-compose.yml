services:
  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: nanoclaw
    restart: always
    volumes:
      # Docker socket for spawning sibling agent containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data directories
      - ./store:/app/store
      - ./data:/app/data
      - ./groups:/app/groups
      - ./logs:/app/logs
      # Credentials (mounted, never baked into image). RW so the
      # trakt autorefresh path (`src/ipc.ts` fetch_trakt_history →
      # admin-tile watch-history script) can write rotated OAuth
      # tokens back to .env on a successful refresh-grant. Without
      # RW the persist step throws OSError 30 (Read-only file
      # system); the in-flight request still succeeds via the
      # in-memory bearer but the next IPC call burns another
      # refresh-grant against a now-rotated refresh token, which
      # eventually breaks.
      - ./.env:/app/.env
      # Shared trusted directory (mounted into trusted + main agent containers)
      - ./trusted:/app/trusted
      # NanoClaw config (mount allowlist, sender allowlist)
      - ${HOME}/.config/nanoclaw:/root/.config/nanoclaw:ro
      # Tessl: credentials + persistent workspace for registry installs
      - ${HOME}/.tessl:/root/.tessl
      - ./tessl-workspace:/app/tessl-workspace
    environment:
      # Docker-out-of-Docker: mount paths must reference the HOST filesystem
      - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-.}
      # Host user UID/GID for agent container --user flag
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Credential proxy binds to all interfaces so agent containers can reach it
      - CREDENTIAL_PROXY_HOST=0.0.0.0
      - TZ=America/Chicago
      - NODE_ENV=production
      # Standard log level. For deep Telegram-path diagnostics (per-call
      # grammy transformer from #87, process-wide HTTP tap from #89, the
      # `[send]`/`[ipc]` tracing from #82), set LOG_LEVEL=debug in .env
      # or the environment for the deploy run — the instrumentation is
      # still in place, just gated off at info.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Agent-image override (#69 review): src/config.ts reads
      # process.env.CONTAINER_IMAGE to decide which image to spawn
      # agent containers from; scripts/deploy.sh reads the same env
      # var to decide which image to rebuild locally. Both must come
      # from the SAME source or the script's "we rebuild what the
      # orchestrator spawns" promise breaks. Pass through here so an
      # operator who exports CONTAINER_IMAGE in their shell (or sets
      # it in `.env`, which Compose reads directly without needing a
      # shell-export) gets a consistent override across the script and
      # the orchestrator. scripts/deploy.sh has matching .env-parsing
      # logic (data-only, no source) so both reach the same value.
      - CONTAINER_IMAGE=${CONTAINER_IMAGE:-nanoclaw-agent:latest}
    ports:
      # Credential proxy — agent containers reach it via host.docker.internal:3001
      - "3001:3001"
    extra_hosts:
      # Docker-on-Linux doesn't auto-provide `host.docker.internal` —
      # we add it explicitly so the orchestrator (and the credential-
      # proxy inside it) can reach ports published on the NAS host
      # by OTHER compose projects, e.g. `nanoclaw-litellm` publishing
      # 4000:4000 from its own UGOS Pro project. Without this entry,
      # the orchestrator's bridge network (`nanoclaw_default`,
      # 172.18.0.0/16) is isolated from the LiteLLM project's bridge
      # network (`nanoclaw-litellm_default`) and cannot reach the
      # `0.0.0.0:4000` published port — neither via the NAS LAN IP
      # nor via the docker bridge gateway, because docker iptables
      # rules don't forward inter-bridge traffic to published ports.
      # `host-gateway` resolves at container start to the host's
      # docker0 / bridge interface IP, which IS the bind target of
      # the published port. Operators flip the LiteLLM router on by
      # setting `ANTHROPIC_BASE_URL=http://host.docker.internal:4000`
      # in `~/nanoclaw/.env`.
      - "host.docker.internal:host-gateway"

  # The `nanoclaw-litellm` service was removed from this compose
  # 2026-05-22. The LiteLLM router now runs as a separate UGOS Pro
  # project on the NAS — that decouples the router's lifecycle from
  # this project's recreate cycle and avoids the multi-agent kill
  # races observed when deploy.sh's step-5 grep (which selects
  # agents by the `^nanoclaw-` prefix) picked up the sidecar before
  # the `^nanoclaw(-litellm)?$` exclude landed in #624.
  #
  # Repo / NAS topology for compose projects that need UGOS Pro UI
  # visibility (orchestrator + sidecars):
  # - Compose files live in this repo under `~/nanoclaw/`. Edits
  #   flow through PR review and `deploy.sh` keeps working unchanged.
  # - A symlink at `/volume1/docker/<project-name>/` points at the
  #   in-repo dir so UGOS Pro's project UI discovers the compose
  #   file. Both deploy.sh (working from `~/nanoclaw/`) and UGOS Pro
  #   (working from the symlinked path) manage the same container
  #   set because Docker derives the compose project name from the
  #   directory basename.
  # - The orchestrator: symlink `/volume1/docker/nanoclaw` →
  #   `/home/jbaruch/nanoclaw`.
  # - The LiteLLM router: symlink `/volume1/docker/nanoclaw-litellm`
  #   → `/home/jbaruch/nanoclaw/container/litellm`.
  #
  # Secrets stay out of the repo. NEVER paste env values into UGOS
  # Pro's project env UI — UGOS dumps those values into the compose
  # file's `environment:` block, and through the symlink they would
  # land in the tracked repo file (verified 2026-05-23: caught
  # before any git contamination, see CHANGELOG entry). Instead,
  # secrets live in `~/nanoclaw/.env` (gitignored at the repo root)
  # and the UGOS project picks them up via a symlinked `.env` inside
  # the project's compose dir:
  #   ln -s ../../.env ~/nanoclaw/container/<project>/.env
  # Linux resolves the relative target against the symlink's own
  # parent, so the chain
  #   /volume1/docker/<project>/.env -> <repo>/container/<project>/.env -> ~/nanoclaw/.env
  # is followed at docker compose read time. The compose YAML stays
  # `${VAR}` placeholders only; docker compose interpolates from
  # `.env` at spawn time. The credential-proxy reads
  # `ANTHROPIC_BASE_URL` from `~/nanoclaw/.env` and routes through
  # whatever URL the operator sets (typically
  # `http://host.docker.internal:4000` for the LiteLLM router — the
  # `extra_hosts` block on this service maps that name to the
  # host-gateway so inter-bridge traffic can reach the LiteLLM
  # project's published port).
  #
  # UGOS Pro UI also stores compose `content` inline in its SQLite
  # DB at `/volume1/@appstore/com.ugreen.docker/db/docker_info_log.db`
  # (table `compose`); the UI renders from there. Adding a new UGOS
  # Pro project rooted at a symlinked path requires a sudo INSERT
  # into that table — see `container/litellm/docker-compose.yaml`
  # for the canonical setup steps.
