services:
  nanoclaw:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: nanoclaw
    restart: always
    volumes:
      # Docker socket for spawning sibling agent containers
      - /var/run/docker.sock:/var/run/docker.sock
      # Persistent data directories
      - ./store:/app/store
      - ./data:/app/data
      - ./groups:/app/groups
      - ./logs:/app/logs
      # Credentials (mounted, never baked into image). RO: nothing in
      # the orchestrator writes .env — the last writer (in-host Trakt
      # OAuth autorefresh) was retired when Trakt moved to the OneCLI
      # gateway (#817). A future flow that must persist a rotated
      # credential needs its own mechanism, not a widened mount.
      - ./.env:/app/.env:ro
      # Shared trusted directory (mounted into trusted + main agent containers)
      - ./trusted:/app/trusted
      # Host sidecar registry (#850) — gitignored machine config, read
      # per run_sidecar call; RO because only the operator edits it
      - ./config:/app/config:ro
      # NanoClaw config (mount allowlist, sender allowlist)
      - ${HOME}/.config/nanoclaw:/root/.config/nanoclaw:ro
      # Tessl: credentials + persistent workspace for registry installs
      - ${HOME}/.tessl:/root/.tessl
      - ./tessl-workspace:/app/tessl-workspace
    environment:
      # Docker-out-of-Docker: mount paths must reference the HOST filesystem
      - HOST_PROJECT_ROOT=${HOST_PROJECT_ROOT:-.}
      # Host user UID/GID for agent container --user flag
      - HOST_UID=${HOST_UID:-1000}
      - HOST_GID=${HOST_GID:-1000}
      # Credential proxy binds to all interfaces so agent containers can reach it
      - CREDENTIAL_PROXY_HOST=0.0.0.0
      - TZ=America/Chicago
      - NODE_ENV=production
      # Standard log level. For deep Telegram-path diagnostics (per-call
      # grammy transformer from #87, process-wide HTTP tap from #89, the
      # `[send]`/`[ipc]` tracing from #82), set LOG_LEVEL=debug in .env
      # or the environment for the deploy run — the instrumentation is
      # still in place, just gated off at info.
      - LOG_LEVEL=${LOG_LEVEL:-info}
      # Agent-image override (#69 review): src/config.ts reads
      # process.env.CONTAINER_IMAGE to decide which image to spawn
      # agent containers from; scripts/deploy.sh reads the same env
      # var to decide which image to rebuild locally. Both must come
      # from the SAME source or the script's "we rebuild what the
      # orchestrator spawns" promise breaks. Pass through here so an
      # operator who exports CONTAINER_IMAGE in their shell (or sets
      # it in `.env`, which Compose reads directly without needing a
      # shell-export) gets a consistent override across the script and
      # the orchestrator. scripts/deploy.sh has matching .env-parsing
      # logic (data-only, no source) so both reach the same value.
      - CONTAINER_IMAGE=${CONTAINER_IMAGE:-nanoclaw-agent:latest}
    ports:
      # Credential proxy — agent containers reach it via host.docker.internal:3001
      - "3001:3001"
    extra_hosts:
      # Docker-on-Linux doesn't auto-provide `host.docker.internal` —
      # we add it explicitly so the orchestrator can reach services
      # running on the NAS host from inside its own bridge network.
      # Notably the OneCLI Agent Vault (#564): when it runs on the NAS
      # host, `ONECLI_URL=http://host.docker.internal:10254` resolves
      # to the host gateway via this mapping. `host-gateway` resolves
      # at container start to the host's docker0 / bridge interface IP,
      # which is the bind target of host-published ports. Without this
      # entry the orchestrator's bridge network (`nanoclaw_default`,
      # 172.18.0.0/16) can't reach those ports.
      - "host.docker.internal:host-gateway"
